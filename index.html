<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d7191f">
<title>Playlist BCV 43</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--red:#d7191f;--ink:#16191d;--bg:#f2f3f5;--line:#e3e6ea;--mute:#69717c;--ok:#17924f}
*{box-sizing:border-box;margin:0}
body{font:16px/1.4 Barlow,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom)}
h1,h2,.tab{font-family:'Barlow Condensed',Barlow,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}
header{position:relative;background:var(--red);color:#fff;padding:calc(22px + env(safe-area-inset-top)) 0 22px}
header::before{content:"";position:absolute;inset:10px;border:2px solid rgba(255,255,255,.28)}
header::after{content:"";position:absolute;top:10px;bottom:10px;left:64%;width:2px;background:rgba(255,255,255,.28)}
.hd{position:relative;z-index:1;display:flex;gap:16px;align-items:center}
.logo{width:84px;height:84px;border-radius:50%;box-shadow:0 0 0 4px #fff;flex:none}
h1{font-size:clamp(30px,7.5vw,46px);line-height:.95;font-weight:700}
header p{margin-top:6px;opacity:.92}
h2{font-size:26px;margin:22px 0 8px}.card h2{margin-top:0}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.who{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;font-weight:600}
.link{background:none;border:0;color:var(--red);font:inherit;text-decoration:underline;cursor:pointer}
nav{position:sticky;top:0;z-index:5;display:flex;gap:6px;padding:8px 0;background:var(--bg)}
.tab{flex:1;border:0;padding:10px 6px;border-radius:10px;background:#e4e6ea;font-size:20px;font-weight:600;color:var(--ink);cursor:pointer}
.tab[aria-selected=true]{background:var(--ink);color:#fff}
.in{display:block;width:100%;font:inherit;padding:14px;margin:0 0 10px;border:2px solid var(--line);border-radius:12px;background:#fff}
.in:focus{outline:none;border-color:var(--red)}
ul{padding:0;list-style:none}
.song{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
li:last-child>.song,li.song:last-child{border-bottom:0}
.song img{width:52px;height:52px;border-radius:8px;object-fit:cover;background:#d9dce1;flex:none}
.meta{flex:1;min-width:0}.meta>*{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta b{font-weight:600}.meta span{color:var(--mute);font-size:14px}.meta small{color:var(--mute);font-size:12.5px;white-space:normal}
.sugbtn{width:100%;background:none;border:0;font:inherit;text-align:left;color:inherit;cursor:pointer;padding:8px 4px;border-radius:10px}
.sugbtn:hover{background:var(--bg)}
.btn{border:0;border-radius:10px;padding:9px 14px;font:600 15px Barlow,sans-serif;background:var(--ink);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
.btn.red{background:var(--red)}.btn.ghost{background:#e4e6ea;color:var(--ink)}
.tag{font-size:13px;font-weight:600;padding:3px 9px;border-radius:99px;background:#e4e6ea;white-space:nowrap}
.tag.ok{background:#d9f2e4;color:#0d6b38}.tag.vote{background:#fde3e4;color:#a5121a}
.act{display:flex;gap:8px;flex-wrap:wrap;width:100%;padding-left:44px}
.chk{position:relative;width:32px;height:32px;flex:none}
.chk input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.chk span{position:absolute;inset:0;border:3px solid var(--ink);border-radius:6px;background:#fff}
.chk input:checked+span{background:var(--ok);border-color:var(--ok)}
.chk input:checked+span::after{content:"";position:absolute;left:8px;top:1px;width:8px;height:16px;border:solid #fff;border-width:0 4px 4px 0;transform:rotate(45deg)}
.chk input:focus-visible+span,.btn:focus-visible,.tab:focus-visible,.sugbtn:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.done .meta b{opacity:.5}.done img{filter:grayscale(.7)}
.empty{color:var(--mute);padding:12px 2px}.hint{color:var(--mute);font-size:14px;margin-top:10px}
.warn{background:#fff3cd;padding:12px;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
main{padding-bottom:60px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><div class="wrap hd"><img class="logo" src="logo.png" alt="Logo BCV 43"><div><h1>Playlist des entraînements</h1><p>Propose les musiques que tu veux entendre au BCV 43.</p></div></div></header>
<main class="wrap">
<section id="gate" class="card" hidden>
<h2>Qui es-tu ?</h2>
<input id="fn" class="in" placeholder="Prénom" autocomplete="given-name">
<input id="ln" class="in" placeholder="Nom" autocomplete="family-name">
<button id="go" class="btn red">Entrer</button>
</section>
<div id="app" hidden>
<div class="who"><span id="whoTxt"></span><button id="chg" class="link">Changer de nom</button></div>
<nav><button class="tab" id="t-add">Proposer</button><button class="tab" id="t-list">Playlist</button><button class="tab" id="t-admin">Admin</button></nav>
<section id="v-add">
<div class="card"><input id="q" class="in" type="search" placeholder="Titre ou artiste…" autocomplete="off"><ul id="sug"></ul></div>
<h2>Propositions en attente</h2>
<div class="card"><ul id="pend"></ul></div>
</section>
<section id="v-list" hidden><h2>Musiques validées</h2><div class="card"><ul id="pub"></ul></div></section>
<section id="v-admin" hidden>
<div id="pin" class="card"><h2>Accès admin</h2><input id="pinIn" class="in" type="password" inputmode="numeric" placeholder="Code admin"><button id="pinGo" class="btn red">Ouvrir</button></div>
<div id="adm" hidden>
<p class="hint" id="ntfyHint"></p>
<h2>À traiter <span class="tag" id="cN"></span></h2><div class="card"><ul id="admNew"></ul></div>
<h2>Validées <span class="tag" id="cV"></span></h2><div class="card"><ul id="admOk"></ul></div>
</div></section>
</div>
</main>
<div id="toast" role="status"></div>
<script src="config.js"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,collection,doc,getDoc,setDoc,updateDoc,deleteDoc,onSnapshot,arrayUnion}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const C=window.CONFIG,$=s=>document.querySelector(s);
if(C.firebase.projectId.startsWith("COLLE")){document.body.insertAdjacentHTML("afterbegin",'<p class="warn">Configuration manquante : remplis le fichier config.js (voir LISEZ-MOI.md).</p>');throw new Error("config")}
const db=getFirestore(initializeApp(C.firebase));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const url=u=>/^https:\/\//.test(u||"")?esc(u):"";
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[(\[].*?[)\]]/g,"").replace(/[^\p{L}\p{N}]+/gu,"-").replace(/^-|-$/g,"");
const slug=(a,t)=>(norm(a)+"_"+norm(t)).slice(0,200);
const cap=s=>s.trim().replace(/\s+/g," ").replace(/(^|[\s-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
let tt;const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2600)};
const jsonp=u=>new Promise((ok,ko)=>{const n="cb"+Date.now()+Math.floor(Math.random()*999),s=document.createElement("script"),end=()=>{delete window[n];s.remove()};window[n]=d=>{end();ok(d)};s.onerror=()=>{end();ko()};s.src=u+"&output=jsonp&callback="+n;document.body.append(s)});
const notify=(t,a)=>fetch("https://ntfy.sh/",{method:"POST",body:JSON.stringify({topic:C.ntfyTopic,title:"🎵 Nouvelle musique",message:t+" — "+a+"\nProposée par "+who(),tags:["musical_note"]})}).catch(()=>{});

let me=JSON.parse(localStorage.getItem("me")||"null"),songs=[],res=[],adm=sessionStorage.getItem("adm")==="1";
const who=()=>me.first+" "+me.last;
function showApp(){$("#gate").hidden=!!me;$("#app").hidden=!me;if(me)$("#whoTxt").textContent="Salut "+me.first+" !"}
$("#go").onclick=()=>{const f=cap($("#fn").value),l=cap($("#ln").value);if(!f||!l)return toast("Écris ton prénom et ton nom");me={first:f,last:l};localStorage.setItem("me",JSON.stringify(me));showApp();render()};
$("#chg").onclick=()=>{localStorage.removeItem("me");me=null;showApp()};
const tabs=["add","list","admin"];
const tab=n=>tabs.forEach(t=>{$("#v-"+t).hidden=t!==n;$("#t-"+t).setAttribute("aria-selected",t===n)});
tabs.forEach(t=>$("#t-"+t).onclick=()=>tab(t));
$("#pinGo").onclick=()=>{if($("#pinIn").value===String(C.adminPin)){adm=true;sessionStorage.setItem("adm","1");render()}else toast("Code incorrect")};

const empty=t=>'<li class="empty">'+t+"</li>";
function row(s,m){
const v=s.voters||[],id=esc(s.id),n=v.length>1?'<span class="tag vote">×'+v.length+"</span>":"";
const img='<img src="'+url(s.cover)+'" alt="" loading="lazy">';
const meta='<span class="meta"><b>'+esc(s.title)+"</b><span>"+esc(s.artist)+"</span><small>"+esc(v.join(", "))+"</small></span>";
if(m==="pub")return'<li class="song">'+img+meta+(s.done?'<span class="tag ok">Dans la playlist</span>':"")+"</li>";
if(m==="vote")return'<li class="song">'+img+meta+n+(v.includes(who())?'<span class="tag">Ton vote ✓</span>':'<button class="btn ghost" data-act="vote" data-id="'+id+'">+1</button>')+"</li>";
const dz=url(s.link);
return'<li class="song '+(s.done?"done":"")+'"><label class="chk" title="Ajoutée à la playlist"><input type="checkbox" data-act="done" data-id="'+id+'" '+(s.done?"checked":"")+"><span></span></label>"+img+meta+n+
'<div class="act"><button class="btn '+(s.valid?"ghost":"red")+'" data-act="valid" data-id="'+id+'">'+(s.valid?"Retirer de la liste":"Valider")+"</button>"+
'<a class="btn ghost" target="_blank" rel="noopener" href="https://open.spotify.com/search/'+encodeURIComponent(s.artist+" "+s.title)+'">Spotify</a>'+
(dz?'<a class="btn ghost" target="_blank" rel="noopener" href="'+dz+'">Deezer</a>':"")+
'<button class="btn ghost" data-act="del" data-id="'+id+'" aria-label="Supprimer">🗑</button></div></li>'}
function render(){
if(!me)return;
const all=[...songs].sort((a,b)=>(b.at||0)-(a.at||0)),pend=all.filter(s=>!s.valid),ok=all.filter(s=>s.valid);
$("#pend").innerHTML=pend.map(s=>row(s,"vote")).join("")||empty("Rien en attente. Tape un titre ci-dessus pour proposer le premier !");
$("#pub").innerHTML=ok.map(s=>row(s,"pub")).join("")||empty("Aucune musique validée pour l'instant.");
$("#pin").hidden=adm;$("#adm").hidden=!adm;
if(adm){$("#admNew").innerHTML=pend.map(s=>row(s,"adm")).join("")||empty("Rien à traiter.");$("#admOk").innerHTML=ok.map(s=>row(s,"adm")).join("")||empty("Aucune musique validée.");
$("#cN").textContent=pend.length;$("#cV").textContent=ok.length;
$("#ntfyHint").textContent="Notifications : installe l'appli gratuite « ntfy » et abonne-toi au sujet « "+C.ntfyTopic+" ».";}}

let tm;
$("#q").oninput=e=>{clearTimeout(tm);const v=e.target.value.trim();if(v.length<2){res=[];$("#sug").innerHTML="";return}
tm=setTimeout(async()=>{try{const d=await jsonp("https://api.deezer.com/search?limit=8&q="+encodeURIComponent(v));if(v!==$("#q").value.trim())return;res=d.data||[];
$("#sug").innerHTML=res.map((t,i)=>{const ex=songs.find(x=>x.id===slug(t.artist.name,t.title));
return'<li><button class="song sugbtn" data-act="pick" data-i="'+i+'"><img src="'+url(t.album.cover_small)+'" alt=""><span class="meta"><b>'+esc(t.title)+"</b><span>"+esc(t.artist.name)+"</span></span>"+(ex?'<span class="tag vote">Déjà proposée ×'+(ex.voters||[]).length+"</span>":"")+"</button></li>"}).join("")||empty("Aucun résultat. Essaie avec le nom de l'artiste.")}
catch{$("#sug").innerHTML=empty("Recherche impossible. Vérifie ta connexion.")}},300)};

async function pick(t){
const id=slug(t.artist.name,t.title),ref=doc(db,"songs",id);
const snap=await getDoc(ref);
if(snap.exists()){if((snap.data().voters||[]).includes(who()))return toast("Tu as déjà proposé ce titre");await updateDoc(ref,{voters:arrayUnion(who())});toast("Déjà proposé : ton vote est ajouté ✓")}
else{await setDoc(ref,{title:t.title,artist:t.artist.name,cover:t.album.cover_medium||"",link:t.link||"",voters:[who()],valid:false,done:false,at:Date.now()});toast("Merci, ta musique est proposée ✓");notify(t.title,t.artist.name)}
$("#q").value="";$("#sug").innerHTML=""}

document.addEventListener("click",async e=>{
const b=e.target.closest("[data-act]");if(!b)return;
const a=b.dataset.act,id=b.dataset.id,ref=id&&doc(db,"songs",id),s=songs.find(x=>x.id===id);
try{
if(a==="pick")await pick(res[+b.dataset.i]);
if(a==="vote")await updateDoc(ref,{voters:arrayUnion(who())});
if(a==="valid")await updateDoc(ref,{valid:!s.valid});
if(a==="done")await updateDoc(ref,{done:b.checked});
if(a==="del"&&confirm("Supprimer ce titre ?"))await deleteDoc(ref);
}catch{toast("Erreur, réessaie")}});

onSnapshot(collection(db,"songs"),q=>{songs=q.docs.map(d=>({id:d.id,...d.data()}));render()},()=>toast("Connexion à la base impossible"));
showApp();tab("add");render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
